<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heitor - 1 aninho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&family=Sacramento&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --sky: #d9ecf4;
    --sky-2: #c6e3ee;
    --blue-deep: #4a90c9;
    --blue-mid: #6fb0dd;
    --blue-soft: #a8d2ea;
    --ink: #2c5d8a;
    --text: #3a6b94;
    --coral: #f4a896;
    --green-soft: #b8d8c2;
    --green-deep: #7fb088;
  }

  html, body {
    width: 100%;
    min-height: 100vh;
    background: linear-gradient(180deg, #e8f3f8 0%, #d4e8f1 60%, #c0dceb 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--text);
    overflow-x: hidden;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 30px 15px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 540px;
    aspect-ratio: 720 / 1080;
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.6) 0%, transparent 40%),
      radial-gradient(ellipse at 80% 85%, rgba(184,216,194,0.4) 0%, transparent 50%),
      linear-gradient(180deg, #e3f0f6 0%, #d2e7f0 50%, #bcdae8 100%);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(74, 144, 201, 0.25), 0 4px 12px rgba(0,0,0,0.06);
    overflow: hidden;
  }

  /* === Decorative SVG positioning === */
  .deco {
    position: absolute;
    pointer-events: none;
  }

  .dolphin-left   { top: 2%;   left: -3%;  width: 32%; transform: rotate(-8deg); }
  .whale-right    { top: 0%;   right: -2%; width: 30%; transform: rotate(8deg); }
  .octopus        { top: 28%;  left: -1%;  width: 16%; }
  .turtle         { top: 33%;  right: 0%;  width: 18%; }
  .jellyfish      { top: 60%;  left: 2%;   width: 13%; }
  .shark          { top: 58%;  right: -2%; width: 22%; transform: rotate(-5deg); }
  .whale-bottom   { top: 75%;  left: 32%;  width: 30%; }
  .seaweed-left   { bottom: 0; left: 0;    width: 22%; }
  .seaweed-right  { bottom: 0; right: 0;   width: 25%; }
  .fish-1         { bottom: 8%; left: 18%; width: 9%; }
  .fish-2         { bottom: 4%; left: 30%; width: 6%; }
  .fish-3         { bottom: 10%; right: 30%; width: 9%; }
  .fish-4         { bottom: 7%; right: 18%; width: 8%; }
  .stingray       { bottom: 3%; right: 8%; width: 11%; }
  .green-blob     {
    position: absolute;
    bottom: 25%;
    left: -5%;
    width: 45%;
    height: 30%;
    background: radial-gradient(ellipse at center, rgba(184,216,194,0.65) 0%, rgba(184,216,194,0) 65%);
    pointer-events: none;
  }

  /* === Floating animations === */
  @keyframes float-y {
    0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
    50%      { transform: translateY(-8px) rotate(var(--rot, 0deg)); }
  }
  @keyframes float-x {
    0%, 100% { transform: translateX(0); }
    50%      { transform: translateX(6px); }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }

  .dolphin-left   { --rot: -8deg; animation: float-y 5s ease-in-out infinite; }
  .whale-right    { --rot: 8deg;  animation: float-y 6s ease-in-out infinite 0.5s; }
  .whale-bottom   { animation: float-x 7s ease-in-out infinite; }
  .turtle         { animation: float-y 4.5s ease-in-out infinite 1s; }
  .jellyfish      { animation: float-y 4s ease-in-out infinite; }
  .seaweed-left, .seaweed-right { transform-origin: bottom center; animation: sway 6s ease-in-out infinite; }
  .fish-1, .fish-3 { animation: float-x 3.5s ease-in-out infinite; }
  .fish-2, .fish-4 { animation: float-x 4s ease-in-out infinite 0.5s; }

  /* === Bubbles === */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.2));
    border: 1px solid rgba(255,255,255,0.5);
  }

  /* === Text content === */
  .content {
    position: relative;
    z-index: 2;
    padding: 8% 10% 0;
    text-align: center;
    height: 100%;
    display: flex;
    flex-direction: column;
  }

  .name {
    font-family: 'Pacifico', cursive;
    font-size: clamp(3.5rem, 11vw, 5.5rem);
    color: var(--blue-deep);
    letter-spacing: 2px;
    line-height: 1;
    margin-top: 4%;
    text-shadow:
      2px 2px 0 #fff,
      -1px -1px 0 rgba(255,255,255,0.8),
      0 4px 8px rgba(74,144,201,0.15);
    -webkit-text-stroke: 1px rgba(74,144,201,0.3);
  }

  .age {
    font-family: 'Sacramento', cursive;
    font-size: clamp(1.6rem, 4.5vw, 2.3rem);
    color: var(--blue-deep);
    margin-top: -2%;
    margin-bottom: 8%;
  }

  .section-title {
    font-family: 'Sacramento', cursive;
    font-size: clamp(1.5rem, 4.2vw, 2.1rem);
    color: var(--ink);
    margin-bottom: 6%;
    position: relative;
    display: inline-block;
    align-self: center;
  }

  .section-title::before,
  .section-title::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 22px;
    height: 14px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 14'><path d='M2 7 Q 6 2, 10 7 T 18 7' stroke='%234a90c9' stroke-width='1.5' fill='none' stroke-linecap='round'/><circle cx='20' cy='7' r='1.5' fill='%234a90c9'/></svg>");
    background-repeat: no-repeat;
    background-size: contain;
  }
  .section-title::before { right: 100%; margin-right: 14px; transform: translateY(-50%) scaleX(-1); }
  .section-title::after  { left: 100%;  margin-left: 14px;  transform: translateY(-50%); }

  .items {
    display: flex;
    flex-direction: column;
    gap: 0;
    flex: 1;
  }

  .item {
    display: grid;
    grid-template-columns: 70px 1fr;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    text-align: left;
    position: relative;
  }

  .item + .item::before {
    content: '';
    position: absolute;
    top: 0;
    left: 18%;
    right: 18%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(74,144,201,0.4) 20%, rgba(74,144,201,0.4) 80%, transparent);
  }
  .item + .item::after {
    content: '';
    position: absolute;
    top: -3.5px;
    left: 50%;
    transform: translateX(-50%);
    width: 8px;
    height: 8px;
    background: var(--blue-soft);
    border-radius: 50%;
    border: 1px solid var(--blue-mid);
  }

  .item .icon {
    width: 70px;
    height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .item .icon svg { width: 100%; height: 100%; }

  .item h3 {
    font-family: 'Sacramento', cursive;
    font-weight: 400;
    font-size: clamp(1.5rem, 4.5vw, 2rem);
    color: var(--ink);
    line-height: 1;
    margin-bottom: 2px;
  }

  .item p {
    font-family: 'Quicksand', sans-serif;
    font-size: clamp(0.85rem, 2.6vw, 1rem);
    color: var(--text);
    font-weight: 500;
  }

  @media (max-width: 420px) {
    body { padding: 15px 8px; }
    .card { border-radius: 14px; }
    .item { grid-template-columns: 55px 1fr; gap: 10px; }
    .item .icon { width: 55px; height: 55px; }
  }
</style>
</head>
